name: CI

# Verifierar varje PR och varje push till main automatiskt — inte bara
# självrapporterat. Kräver inga hemligheter: bygget anropar aldrig AI-motorn.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (struktureringslogiken)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
